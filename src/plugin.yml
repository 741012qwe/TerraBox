name: TerraBox
version: '2.4.0'
main: com.terrabox.TerraBoxPlugin
api-version: '1.20'
folia-supported: true
softdepend: [Vault]
description: 物资大陆 - 多世界PVP吃鸡 大厅+对局世界池 随机物资箱资源经济 毒圈/神器/附魔石
author: lwen
commands:
  box:
    description: 物资大陆主命令
    usage: /box [spawn|sell|craft|hunt|top|stats|prices|join|room|invite|lobby|spectate|storm|artifacts|terrain|game]
    aliases: [tb, supply, wuzi]
    permission: terrabox.use
permissions:
  terrabox.use:
    default: true
  terrabox.admin:
    default: op
