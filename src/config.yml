# ==================== 毒圈配置 ====================
storm:
  enabled: true
  phases: 5                              # 收缩次数 (共5次)
  shrink-factor: 0.6                     # 每次收缩半径比例 (0.6 = 缩小40%)
  wait-seconds: 60                       # 每圈停留时间 (秒)
  shrink-duration-seconds: 40            # 收缩持续时间 (秒)
  damage-per-second: 1.0                 # 基础伤害 (心/秒)
  damage-increase-per-phase: 1.0         # 每阶段增加伤害 (心/秒)
  initial-radius-factor: 0.95            # 初始圈半径比例 (相对地图边界)

  # 粒子效果
  particles-enabled: true
  particles-interval-ticks: 4
  particles-boundary-enabled: true
  particles-boundary-density: 3
  particles-view-range: 48
  particles-fog-enabled: true
  particles-fog-density: 1.0

