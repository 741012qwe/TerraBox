      - "&7持续 12 秒。"
    duration-seconds: 12
  freeze_crystal:
    material: ICE
    effect: FREEZE
    name: "&b&l冰霜禁锢"
    lore:
      - "&7右键使用, 冻结周围敌人。"
      - "&7使其减速并发光 8 秒。"
    radius: 5.0
    duration-seconds: 8
  shield_charge:
    material: SHIELD
    effect: SHIELD
    name: "&f&l铁壁护盾"
    lore:
      - "&7右键使用, 获得抗性提升。"
      - "&7持续 10 秒。"
    duration-seconds: 10
  fire_res_charge:
    material: BLAZE_POWDER
    effect: FIRE_RES
    name: "&c&l烈焰抗性"
    lore:
      - "&7右键使用, 获得防火效果。"
      - "&7持续 15 秒。"
    duration-seconds: 15
  tnt_charge:
    material: TNT
    effect: TNT_LAUNCH
    name: "&6&l轰天炸药"
    lore:
      - "&7右键掷出一枚不会伤及自己的 TNT。"
      - "&7爆炸范围内快速逃开!"
    radius: 5.0
  repulse_wave:
    material: FIREWORK_STAR
    effect: REPULSE
    name: "&d&l冲击波"
    lore:
      - "&7右键释放击退波, 把周围玩家炸飞。"
      - "&7不造成伤害, 适合突围逃生。"
    radius: 6.0
    velocity: 2.0
  enemy_tracker:
    material: COMPASS
    effect: TRACK
    name: "&e&l追踪罗盘"
    lore:
      - "&7右键使用, 锁定一名随机存活敌人。"
      - "&7在其头顶持续显示方向与距离 25 秒。"
    duration-seconds: 25

# ================================================
#  地形装饰 (资源大陆风格)
#  边界屏障墙 + 中心战场 + 四条主干道 + 四座瞭望塔
# ================================================
decorator:
  enabled: true
  batch-per-tick: 6            # 每 tick 提交的区块任务数
  clear-center-radius: 30      # 中心战场清理半径 (清植被)
  wall-height: 3               # 边界屏障墙基础高度
  wall-extra-height: 6         # 边界墙额外加高 (防外围地形抬升越过边界)
  tower-distance: 320          # 瞭望塔距中心距离
  tower-rarity: EPIC           # 塔顶物资箱稀有度

# ================================================
#  对局玩法 (吃鸡式 PVP 资源争夺)
#  模式: solo 单人(无PvP, 时间制积分结算, 任意人数可开) / pvp(淘汰制) / team(组队)
#  流程: 报名 → 倒计时 → 出生广场聚集 → 搜刮/PvP → 仅剩1人 → 自动送大厅 → 恢复地形
# ================================================
game:
  enabled: true
  countdown-seconds: 30        # 开赛倒计时
  duration-minutes: 30         # 对局时长上限 (单人按积分结算; 多人PVP/组队到时间按击杀/存活结算)
  no-timeout: false            # true 则多人PVP/组队不设时间上限(纯淘汰制), 直到剩1人/1队
  win-reward: 1000.0           # 胜者奖励 (Vault/内置积分)
  team-count: 2                # 组队模式队伍数
  min-players: 2               # 对战/组队最少参战人数 (单人模式任意人数)
  tracker-grant-minutes: 10        # 对局超过该分钟数, 自动给每个存活玩家发一枚追踪器
  spawn-area-radius: 7         # 出生广场半径(格), 对局玩家聚集点
  spawn-area-box-rarity:       # 广场中央开局物资箱稀有度
    - EPIC
    - EPIC
    - LEGENDARY
    - LEGENDARY

# ================================================
#  毒圈 (Storm / 缩圈) —— 吃鸡安全区
#  对局开始后整图安全, 每隔一段时间缩圈;
#  圈外玩家持续受递增伤害, 迫使向圈内靠拢, 加速决战
# ================================================
storm:
  enabled: true                # 启用毒圈
  phases: 5                    # 收缩阶段数 (初始满图算第1阶段, 之后每阶段收缩一次)
  initial-radius-factor: 0.95  # 初始安全区半径占地图半径的比例 (0.2~1.0)
  shrink-factor: 0.6           # 每阶段新圈半径 = 旧圈半径 × 该系数 (越小收缩越狠)
  wait-seconds: 60             # 每阶段停留时间 (秒), 到点开始收缩
  shrink-duration-seconds: 40  # 收缩过渡时长 (秒), 圈从旧半径收到新半径
  damage-per-second: 1.0       # 圈外每秒基础伤害 (半心计)
  damage-increase-per-phase: 1.0  # 每阶段递增的额外每秒伤害
  # --- 毒圈粒子特效 ---
  particles-enabled: true         # 启用毒圈粒子特效
  particles-interval-ticks: 4     # 粒子刷新间隔 (tick, 越小越流畅; 20 tick=1秒)
  particles-boundary-enabled: true # 安全区边界线粒子
  particles-boundary-density: 3    # 边界线每点粒子密度 (越多越密集)
  particles-view-range: 48         # 只在该半径内生成边界粒子 (远处省性能)
  particles-fog-enabled: true      # 圈外毒雾粒子
  particles-fog-density: 1.0       # 毒雾浓度系数 (随阶段自动递增)

# ================================================
#  神器 —— 吃鸡终极装备 (传说/绝世箱子低概率掉落)
#  material=承载材质  effect=效果类型  proc-chance=触发概率
#  magnitude=效果强度  enchants=自带附魔
#  效果类型:
#   LIFESTEAL   攻击吸血
#   VAMPIRIC    攻击大量吸血
#   BLEED       攻击概率让目标流血+减速
#   FROST       攻击概率冻结 (减速+发光)
#   THORNS      受击反弹伤害 (护甲)
#   SPEED       移速加成
#   STRENGTH    攻击力加成
#  在战利品表 items 里用 artifact: <key> 引用, 即有概率开箱获得神器
# ================================================
artifacts:
  celestial_blade:
    material: NETHERITE_SWORD
    name: "&6&l苍穹之刃"
    lore:
      - "&7传说中斩落星辰的神剑。"
      - "&7攻击吸血, 命中概率让目标流血。"
    effect: LIFESTEAL
    proc-chance: 0.30
    magnitude: 1.0
    enchants: {SHARPNESS: 5, UNBREAKING: 4, FIRE_ASPECT: 2}
  aegis_axe:
    material: NETHERITE_AXE
    name: "&c&l神盾重斧"
    lore:
      - "&7一斧可撼动山岳。"
      - "&7高额攻击, 命中概率击退冻结。"
    effect: FROST
    proc-chance: 0.35
    magnitude: 1.2
    enchants: {SHARPNESS: 5, UNBREAKING: 4, EFFICIENCY: 5}
  draco_bow:
    material: BOW
    name: "&e&l屠龙圣弓"
    lore:
      - "&7箭无虚发, 箭箭索命。"
      - "&7射出的箭附带火焰与高额伤害。"
    effect: STRING
    proc-chance: 0.40
    magnitude: 1.0
    enchants: {POWER: 5, FLAME: 2, INFINITY: 1, PUNCH: 2}
  titan_chest:
    material: NETHERITE_CHESTPLATE
    name: "&d&l泰坦铠甲"
    lore:
      - "&7坚不可摧的巨人护甲。"
      - "&7受击反弹伤害, 大幅减伤。"
    effect: THORNS
    proc-chance: 0.25
    magnitude: 2.0
    enchants: {PROTECTION: 5, UNBREAKING: 4, THORNS: 3}
  wind_boots:
    material: NETHERITE_BOOTS
    name: "&b&l疾风之靴"
    lore:
      - "&7如风般迅捷。"
      - "&7大幅提升移动速度。"
    effect: SPEED
    proc-chance: 0.30
    magnitude: 0.25
    enchants: {PROTECTION: 4, FEATHER_FALLING: 4, UNBREAKING: 4}
  vampire_fang:
    material: NETHERITE_AXE
    name: "&d&l吸血獠牙"
    lore:
      - "&7饮血而猎, 愈战愈勇。"
      - "&7每次攻击吸取生命。"
    effect: VAMPIRIC
    proc-chance: 0.35
    magnitude: 1.2
    enchants: {SHARPNESS: 5, UNBREAKING: 4, LOOTING: 3}

# ================================================
#  附魔石 —— 从物资箱掉落, 右键对手持装备施加附魔
#  (material=承载材质  name=名称  lore=描述  exotic=是否高级石)
#  在战利品表 items 里用 enchant-stone: normal|exotic 引用随机附魔石
# ================================================
enchant-stones:
  normal:
    material: LAPIS_LAZULI
    name: "&b&l附魔石"
    lore:
      - "&7鼠标拿取此石, 右键背包中的武器/工具/护甲即可附魔。"
      - "&7目标需为可附魔装备 (剑/镐/斧/盔/胸/腿/靴/弓等)。"
      - "&7消耗 1 枚附魔石, 随机施加对应附魔。"
    exotic: false
  exotic:
    material: AMETHYST_SHARD
    name: "&d&l稀有附魔石"
    lore:
      - "&7鼠标拿取此石, 右键背包中的武器/工具/护甲施加高级附魔。"
      - "&7概率获得更高等级附魔, 适用于高等级装备强化。"
    exotic: true

# ================================================
#  跨世界传送门 (正常主世界 ↔ 地狱 / 末地)
#  主世界 (NORMAL) 出生广场附近放置地狱门/末地门, 走进去即传送
#  地狱 (arena_nether) / 末地 (arena_the_end) 放置回主世界门
#  offset-x/z: 传送门相对出生广场的偏移   radius: 传送触发半径
#  target-<kind>: 目标世界名 (主机关的固定地狱/末地世界)
# ================================================
portals:
  enabled: true
  offset-x: 0
  offset-z: 120               # 出生广场北侧 120 格
  radius: 3.0                 # 触发半径
  target-nether: "arena_nether_1"
  target-the_end: "arena_the_end_1"
  target-normal: "arena_normal_1"

# ================================================
#  各世界战利品差异化 (不同世界箱子数量/品质不同)
#  world-loot.<key>: 按地形类型键 (normal/desert/islands/the_end/badlands/nether/city/default)
#    max-count: 箱子数量上限      initial-fill: 首批投放
#    refill-per-cycle: 每周期补充  weight: 品质分布权重 (COMMON/RARE/EPIC/LEGENDARY/MYTHIC)
#  未配置键回退 world-loot.default → 全局 boxes/loot 配置
#  例: 正常主世界箱子少 + 品质低 (更基础), 沙漠/岛屿等特殊世界箱子多 + 品质高
# ================================================
world-loot:
  normal:                     # 正常主世界: 箱子少 + 品质低 (基础世界)
    max-count: 60
    initial-fill: 40
    refill-per-cycle: 3
    weight: {COMMON: 65, RARE: 22, EPIC: 9, LEGENDARY: 3, MYTHIC: 1}   # 高品质极低
  default:                    # 其余世界: 箱子多 + 品质高
    max-count: 200
    initial-fill: 150
    refill-per-cycle: 8
    weight: {COMMON: 50, RARE: 27, EPIC: 15, LEGENDARY: 7, MYTHIC: 1}


