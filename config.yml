# ================================================
#            物资大陆 TerraBox 配置文件
#   多世界 PVP 吃鸡 | 大厅 + 对局世界池
# ================================================

world:
  name: "resource_land"        # 兼容旧资源世界名 (已废弃, 对局世界用 arena)
  border-size: 2048.0          # 默认对局世界边界 (2048x2048)
  seed: 0                      # 地图种子, 0 = 随机
  pregen: true                 # 自动预生成对局世界区块
  pregen-batch: 5000           # 每批预生成区块数 (5000/tick = 100000区块/秒, 全异步不卡线程)
  pregen-interval-ticks: 1     # 每批间隔 (tick); 1 tick = 5000区块/秒
  plain-radius: 120            # 中心平坦区半径 (格)
  base-height: 64              # 中心地表基准高度 (y)
  cover: true                  # 启用地形遮挡 (掩体/遮蔽结构)
  cover-chance: 0.28           # 每个区块出现遮挡的概率 (0..1, 约每3~4区块一处)

# ================================================
#  大厅世界 (terra_lobby 512x512): 玩家聚集地
# ================================================
lobby:
  name: "terra_lobby"
  border-size: 512.0
  platform-y: 64               # 平台基准高度
  platform-radius: 24          # 中心广场半径 (格, 玩家聚集)
  batch-per-tick: 8            # 每 tick 构建区块数

# ================================================
#  对局世界池 (多世界): 地形模板与数量
#  size: 世界尺寸 (默认/沙漠/大岛屿均 2048x2048)
#  worlds: 预创建的数量
# ================================================
arena:
  default:
    size: 2048
    worlds: 1
  desert:
    size: 2048
    worlds: 1
  islands:
    size: 2048
    worlds: 1
    island-chance: 0.55        # 岛屿生成概率 (每个16x16宏区块)
  the_end:
    size: 2048
    worlds: 1                  # 末地岛屿世界数量 (THE_END 环境, 黑色天空)
    island-chance: 0.42        # 外围浮空小岛生成概率 (每个16x16宏区块)
  badlands:
    size: 2048
    worlds: 1                  # 恶地世界数量 (红沙+彩陶瓦层, 侵蚀平顶山)
  nether:
    size: 2048
    worlds: 1                  # 下界世界数量 (NETHER 环境, 红色天空/岩浆湖)
  city:
    size: 2048
    worlds: 1                  # 城市世界数量 (街道网格+建筑群+公园)
  normal:
    size: 2048                 # 正常主世界尺寸 (2048x2048 边境墙/围墙)
    worlds: 1                  # 正常主世界数量 (多样地形+地狱/末地传送门)
  big-buildings: 3             # 大型物资建筑数量 (室内多个物资箱)

boxes:
  max-count: 200               # 全图物资箱总数上限
  initial-fill: 150            # 预生成完成后首批投放数量
  refill-per-cycle: 8          # 每个维护周期最多补充数量
  min-distance: 18.0           # 箱子之间的最小水平距离 (格)
  edge-padding: 16             # 距世界边界的保护距离 (格)
  refresh-minutes: 45          # 物资箱存留时间, 到期自动换位置重生成
  refill-on-open: true         # 物资箱被搬空后, 立即在别处补一个同稀有度箱子
  protect-break: true          # 禁止破坏物资箱 (管理员可用 /box admin wipe)
  protect-hopper: true         # 禁止漏斗/容器抽取物资箱内容
  broadcast-mythic: true       # 绝世物资箱投放时全服广播
  broadcast-airdrop: true      # 空投投放时全服广播坐标

spawn:
  on-first-join: true          # 新玩家首次进服随机陆地出生
  on-respawn: false            # 死亡重生后传送到随机陆地
  min-radius: 80               # 出生点距地图中心最小距离
  max-radius: 360              # 出生点距地图中心最大距离 (边界392)
  tries: 10                    # 找陆地重试次数
  command-cooldown-seconds: 300  # /box spawn 冷却 (管理员免冷却)

economy:
  use-vault: true              # 检测到 Vault 则使用 Vault 经济, 否则用内置积分
  loot-money: true             # 开箱额外掉落货币
  start-money: 0               # 新玩家内置积分初始值

airdrop:
  enabled: true                # 定时空投 (全服广播坐标的传说箱)
  interval-minutes: 20         # 空投间隔
  rarity: LEGENDARY            # 空投资源箱稀有度

hunt:
  cost: 120                    # 寻宝消耗货币
  rarities: [EPIC, LEGENDARY, MYTHIC]   # 寻宝可提示的稀有度

particles:
  enabled: true                # 高稀有度物资箱粒子标记
  rarities: [LEGENDARY, MYTHIC]
  interval-ticks: 60

# 回收商店价格表 (单位: 元/个)  /box sell 或 /box prices 查看
