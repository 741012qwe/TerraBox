  prices:
    COAL: 1.5
    COPPER_INGOT: 1.0
    IRON_INGOT: 4.0
    GOLD_INGOT: 10.0
    IRON_BLOCK: 36.0
    GOLD_BLOCK: 90.0
    DIAMOND: 45.0
    DIAMOND_BLOCK: 405.0
    EMERALD: 18.0
    EMERALD_BLOCK: 162.0
    NETHERITE_SCRAP: 80.0
    NETHERITE_INGOT: 320.0
    LAPIS_LAZULI: 2.0
    REDSTONE: 1.5
    QUARTZ: 2.5
    AMETHYST_SHARD: 6.0
    ANCIENT_DEBRIS: 120.0
    EXPERIENCE_BOTTLE: 8.0
    GOLDEN_APPLE: 60.0
    ENDER_PEARL: 15.0
    BLAZE_ROD: 12.0
    GHAST_TEAR: 20.0
    PHANTOM_MEMBRANE: 10.0
    LEATHER: 2.0
    FEATHER: 0.5
    STRING: 0.8
    GUNPOWDER: 3.0
    ARROW: 0.3
    TOTEM_OF_UNDYING: 250.0
    ELYTRA: 900.0
    TRIDENT: 600.0

