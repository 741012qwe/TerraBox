# ================================================
#  特殊道具 (右键触发自定义效果)
#  每种道具: material=承载材质, effect=效果类型, radius=作用半径,
#            damage=伤害(半心=0.5), velocity=击退力度, duration-seconds=效果时长
#  效果类型:
#   FIREBALL    火焰弹砸地: 砸向准星前方地面, 不伤自己, 对范围内其他玩家造成
#               半心(0.5)伤害, 并按原版 TNT 距离炸飞 (velocity 越高飞越远)
#   HEAL        治疗: 范围内玩家回血 4~8 心
#   LIGHTNING   雷击: 准星处落雷, 对范围内敌人伤害 (damage*6)
#   SPEED       急速: 自己获得速度 buff
#   JUMP        跳跃提升 buff
#   FREEZE      冰冻: 范围内敌人减速+发光
#   SHIELD      抗性提升 buff
#   FIRE_RES    防火 buff
#   TNT_LAUNCH  掷出受控 TNT (不伤自己)
#   REPULSE     击退波: 把周围玩家炸飞 (不造成伤害)
#  在战利品表 items 里用 special: <key> 引用, 即有概率开箱获得该特殊道具
# ================================================
special-items:
  fireball_tnt:
    material: FIRE_CHARGE
    effect: FIREBALL
    name: "&6&l震地火弹"
    lore:
      - "&7右键朝地面砸下, 引爆范围冲击。"
      - "&7不伤自己, 对周围玩家造成 &c半心 &7伤害,"
      - "&7并按 TNT 力度把其他玩家炸飞。"
    radius: 4.0
    damage: 0.5
    velocity: 1.6
  fireball_big:
    material: FIRE_CHARGE
    effect: FIREBALL
    name: "&d&l烈焰震地弹"
    lore:
      - "&7右键朝地面砸下, 大范围爆炸。"
      - "&7不伤自己, 对周围玩家造成 &c半心 &7伤害,"
      - "&7并把其他玩家炸飞得更远。"
    radius: 6.0
    damage: 0.5
    velocity: 2.2
  heal_potion:
    material: POTION
    effect: HEAL
    name: "&a&l回春药剂"
    lore:
      - "&7右键使用, 恢复范围内生命。"
      - "&7为自己和附近玩家回复 4~8 心。"
    radius: 5.0
  lightning_wand:
