# 物资大陆测试配置
world:
  name: resource_land
  border-size: 784

boxes:
  initial-fill: 150
  max-count: 320
  min-distance: 24
  edge-padding: 24
  refill-per-cycle: 12
  refresh-minutes: 45
  refill-on-open: true

decorator:
  enabled: true
  batch-per-tick: 6
  clear-center-radius: 30
  wall-height: 3
  tower-distance: 320
  tower-rarity: EPIC

game:
  spawn-area-radius: 7
  spawn-area-box-rarity:
    - EPIC
    - EPIC
    - LEGENDARY
    - LEGENDARY
  min-players: 1
  countdown-seconds: 30
  duration-minutes: 30
  win-reward: 1000

loot:
  COMMON:
    items:
      - material: IRON_INGOT
        min: 2
        max: 5
        chance: 100
      - material: GOLD_INGOT
        min: 1
        max: 3
        chance: 50
      - material: DIAMOND
        min: 1
        max: 2
        chance: 20
      - material: ENCHANTED_BOOK
        enchants: {POWER:1-3, UNBREAKING:1}
        chance: 15
    money:
      min: 50
      max: 200
      chance: 100
